<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تحدي الحروف | أكاديمية رواد المواهب</title>

<style>
@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Light.otf') format('opentype');
  font-weight:300;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Regular.otf') format('opentype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Medium.otf') format('opentype');
  font-weight:500;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Bold.otf') format('opentype');
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Black.otf') format('opentype');
  font-weight:900;
  font-style:normal;
  font-display:swap;
}

*{box-sizing:border-box}

:root{
  --bg1:#06121e;
  --bg2:#102a44;
  --text:#fff;
  --cell:#f8fafc;
  --cellText:#111827;
  --teamLR:#4F7DC7;
  --teamTB:#8BCB2F;
  --gold:#F6C744;
  --brandGreen:#8BCB2F;
  --brandBlue:#4F7DC7;
  --brandOrange:#F7941D;
  --brandYellow:#F6C744;
  --brandBrown:#8B4A22;
}

body.light{
  --bg1:#f8fafc;
  --bg2:#e5e7eb;
  --text:#111827;
  --cell:#ffffff;
  --cellText:#111827;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Thmanyah',sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(139,203,47,.28),transparent 28%),
    radial-gradient(circle at 0% 38%,rgba(79,125,199,.25),transparent 32%),
    radial-gradient(circle at 100% 45%,rgba(247,148,29,.22),transparent 30%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#07111f);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:var(--text);
}

.page{
  width:100%;
  max-width:1180px;
  padding:20px;
}

.main-logo{
  width:185px;
  display:block;
  margin:0 auto 12px;
  filter:drop-shadow(0 0 30px rgba(139,203,47,.35));
}

.academy-name{
  margin:-2px auto 10px;
  font-size:22px;
  font-weight:900;
  color:#f8fafc;
  letter-spacing:.2px;
  text-shadow:0 0 18px rgba(79,125,199,.35);
}

.developer-credit{
  position:fixed;
  right:16px;
  bottom:10px;
  z-index:70;
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.42);
  letter-spacing:.25px;
  pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.25);
}

body.light .developer-credit{
  color:rgba(17,24,39,.42);
}

.setup-brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-bottom:18px;
}

.setup-logo{
  width:112px;
  max-height:112px;
  object-fit:contain;
  filter:drop-shadow(0 0 20px rgba(139,203,47,.35));
}

.setup-title{
  font-size:30px;
  font-weight:900;
  color:#fde68a;
}

.setup-subtitle{
  font-size:17px;
  font-weight:800;
  color:#cbd5e1;
}


.toolbar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.panel{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  padding:10px 14px;
  border-radius:18px;
}

input,select{
  font-family:'Thmanyah',sans-serif;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:var(--text);
  border-radius:12px;
  padding:8px 10px;
  outline:none;
}

.btn{
  font-family:'Thmanyah',sans-serif;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:var(--text);
  padding:10px 22px;
  border-radius:15px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.16);
}

.timer-box{
  font-size:34px;
  line-height:1;
  font-weight:900;
  color:var(--gold);
  margin:0;
  letter-spacing:1px;
  text-shadow:0 0 18px rgba(212,175,55,.35);
}

.board-wrap{
  position:relative;
  width:820px;
  height:590px;
  margin:0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.board-glow{
  position:absolute;
  width:700px;
  height:520px;
  border-radius:50%;
  background:
    radial-gradient(circle at center,rgba(246,199,68,.16),transparent 55%),
    radial-gradient(circle at left,var(--teamLR),transparent 38%),
    radial-gradient(circle at right,var(--teamLR),transparent 38%),
    radial-gradient(circle at top,var(--teamTB),transparent 34%),
    radial-gradient(circle at bottom,var(--teamTB),transparent 34%);
  filter:blur(34px);
  opacity:.38;
}

svg{
  width:780px;
  height:580px;
  overflow:visible;
  z-index:2;
}

.cell{cursor:pointer}

.hex{
  fill:var(--cell);
  stroke:#111827;
  stroke-width:3;
  transition:.18s;
}

.letter{
  font-size:39px;
  font-weight:800;
  fill:var(--cellText);
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.cell:hover .hex{fill:#fde68a}

.cell.selected .hex{
  stroke:#facc15;
  stroke-width:8;
  filter:drop-shadow(0 0 16px rgba(250,204,21,.9));
}

.cell.teamLR .hex{
  fill:var(--teamLR) !important;
  stroke:rgba(255,255,255,.94) !important;
  stroke-width:2.35 !important;
  filter:
    drop-shadow(0 20px 10px var(--teamLRGlow))
drop-shadow(0 45px 25px var(--teamLRGlow))
drop-shadow(0 80px 55px var(--teamLRGlow))
    drop-shadow(0 12px 15px rgba(15,23,42,.13)) !important;
}

.cell.teamTB .hex{
  fill:var(--teamTB) !important;
  stroke:rgba(255,255,255,.94) !important;
  stroke-width:2.35 !important;
  filter:
    drop-shadow(0 20px 10px var(--teamTBGlow))
drop-shadow(0 45px 25px var(--teamTBGlow))
drop-shadow(0 80px 55px var(--teamTBGlow))
    drop-shadow(0 12px 15px rgba(15,23,42,.13)) !important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}

.modal.show{display:flex}

.modal-box{
  width:90%;
  max-width:620px;
  padding:36px;
  border-radius:32px;
  background:
    radial-gradient(circle at top,rgba(212,175,55,.25),transparent 35%),
    linear-gradient(145deg,#111827,#020617);
  border:1px solid rgba(212,175,55,.45);
  box-shadow:0 0 85px rgba(212,175,55,.35);
  color:white;
}

.modal-box h2{
  font-size:36px;
  margin:0 0 18px;
  color:#fde68a;
}

.start-grid{
  display:grid;
  gap:14px;
  text-align:right;
}

.start-row{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:14px;
}

.start-row label{
  display:block;
  margin-bottom:8px;
  color:#fde68a;
  font-weight:800;
}

.start-row input{
  width:100%;
  margin-bottom:12px;
}

.palette{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.color-choice{
  width:44px;
  height:44px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.35);
  cursor:pointer;
  transition:.2s;
}

.color-choice:hover{
  transform:scale(1.1);
}

.color-choice.active{
  border-color:#fde68a;
  box-shadow:0 0 18px #fde68a;
}

.color-choice.disabled{
  opacity:.25;
  pointer-events:none;
}

.modal-box p{
  font-size:23px;
  line-height:1.8;
}


.winner-icon{
  font-size:64px;
  line-height:1;
  margin-bottom:12px;
  filter:drop-shadow(0 0 24px rgba(212,175,55,.8));
}

#winnerText{
  font-size:34px;
  font-weight:900;
  color:#fde68a;
  margin:8px 0 8px;
}

.winner-sub{
  font-size:20px;
  opacity:.9;
  margin-bottom:20px;
}


.question-card{
  position:relative;
  text-align:center;
}

.close-x{
  position:absolute;
  top:16px;
  left:16px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:white;
  font-size:26px;
  line-height:1;
  cursor:pointer;
  font-family:'Thmanyah',sans-serif;
}

.question-letter{
  width:92px;
  height:104px;
  margin:10px auto 18px;
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  background:linear-gradient(145deg,#fde68a,#d4af37);
  color:#111827;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:48px;
  font-weight:900;
  filter:drop-shadow(0 0 18px rgba(212,175,55,.55));
}

.answer-title{
  color:#cbd5e1;
  font-size:20px;
  margin:4px 0 18px;
}

.answer-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer-btn{
  min-height:64px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  color:white;
  font-size:20px;
  font-weight:900;
  font-family:'Thmanyah',sans-serif;
  cursor:pointer;
  transition:.2s;
}

.answer-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.answer-tb{
  background:var(--teamTB);
  box-shadow:0 0 20px color-mix(in srgb, var(--teamTB) 70%, transparent);
}

.answer-lr{
  background:var(--teamLR);
  box-shadow:0 0 20px color-mix(in srgb, var(--teamLR) 70%, transparent);
}

@media(max-width:850px){
  .answer-buttons{
    grid-template-columns:1fr;
  }

  .question-letter{
    width:78px;
    height:88px;
    font-size:42px;
  }
}

.match-score{
  width:min(1040px,96vw);
  margin:12px auto 4px;
  display:grid;
  grid-template-columns:minmax(190px,1fr) minmax(170px,230px) minmax(190px,1fr);
  align-items:center;
  gap:14px;
  color:var(--text);

  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  padding:12px 16px;
  box-shadow:0 18px 46px rgba(0,0,0,.22);
  backdrop-filter:blur(14px);
}

.score-pill{
  min-width:0;
  padding:12px 18px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  font-weight:900;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score-pill .num{
  display:inline-block;
  margin-inline-start:10px;
  color:#fde68a;
  font-size:26px;
  vertical-align:middle;
}

.hud-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.round-pill{
  min-width:155px;
  padding:7px 12px;
  border-radius:16px;
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.28);
  font-weight:900;
  color:#fde68a;
  font-size:15px;
}

.match-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.match-option{
  display:block;
  cursor:pointer;
}

.match-option input{
  display:none;
}

.match-option span{
  display:block;
  padding:12px 10px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.14);
  text-align:center;
  font-weight:900;
  transition:.2s;
}

.match-option input:checked + span{
  border-color:#fde68a;
  box-shadow:0 0 18px rgba(253,230,138,.45);
  color:#fde68a;
}

.flame{
  position:fixed;
  bottom:-30px;
  z-index:155;
  pointer-events:none;
  font-size:34px;
  animation:flameRise 2.2s ease-out forwards;
  filter:drop-shadow(0 0 14px #f97316);
}

@keyframes flameRise{
  0%{transform:translateY(0) scale(.8) rotate(0deg); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-72vh) scale(1.45) rotate(24deg); opacity:0}
}


.action-row{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.confetti{
  position:fixed;
  top:-12px;
  width:10px;
  height:16px;
  border-radius:3px;
  z-index:150;
  pointer-events:none;
  animation:confettiFall 2.8s linear forwards;
}

@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg); opacity:1}
  100%{transform:translateY(110vh) rotate(720deg); opacity:0}
}

body.presentation .toolbar,
body.presentation .page > .action-row{
  display:none;
}

body.presentation .page{
  max-width:100vw;
}

body.presentation .main-logo{
  width:155px;
  margin-bottom:4px;
}

body.presentation .timer-box{
  margin:0 0 -25px;
}

.presentation-exit{
  display:none;
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:80;
}

body.presentation .presentation-exit{
  display:block;
}

@media(max-width:850px){
  body{
    display:block;
    min-height:100svh;
    overflow-x:hidden;
  }

  .page{
    width:100%;
    max-width:100%;
    padding:12px;
    overflow:hidden;
  }

  .main-logo{
    width:135px;
    margin:0 auto 6px;
  }

  .academy-name{
    font-size:18px;
    margin-bottom:8px;
  }

  .developer-credit{
    font-size:10px;
    right:10px;
    bottom:7px;
  }

  .toolbar{
    gap:8px;
    margin-bottom:8px;
  }

  .panel{
    width:100%;
    gap:8px;
    padding:8px;
    border-radius:16px;
  }

  .panel .btn{
    flex:1 1 120px;
    padding:9px 10px;
    font-size:15px;
  }

  .panel select{
    flex:1 1 72px;
    min-width:72px;
    padding:8px;
    font-size:15px;
  }

  .timer-box{
    font-size:28px;
    margin:6px 0 0;
  }

  .match-score{
    width:100%;
    grid-template-columns:1fr;
    margin:8px auto 0;
    gap:8px;
    padding:10px;
  }

  .hud-center{
    order:-1;
  }

  .score-pill{
    width:100%;
    min-width:0;
    padding:8px 10px;
    font-size:15px;
  }

  .round-pill{
    width:auto;
    min-width:150px;
  }

  .match-options{
    grid-template-columns:1fr;
  }

  .board-wrap{
    width:100%;
    height:auto;
    margin:0 auto 4px;
    transform:none;
  }

  .board-glow{
    width:88vw;
    height:66vw;
    filter:blur(22px);
    opacity:.34;
  }

  svg{
    width:98vw;
    height:auto;
    max-width:780px;
  }

  .btn#resetBtn{
    width:100%;
    max-width:280px;
    margin-top:4px;
  }

  .modal-box{
    width:92%;
    max-width:520px;
    max-height:88svh;
    overflow:auto;
    padding:22px;
    border-radius:26px;
  }

  .modal-box h2{
    font-size:28px;
    margin-bottom:14px;
  }

  .modal-box p{
    font-size:19px;
  }

  .start-grid{
    gap:10px;
  }

  .start-row{
    padding:12px;
  }

  .start-row input,
  input,
  select{
    font-size:16px;
  }

  .palette{
    justify-content:center;
  }

  .color-choice{
    width:42px;
    height:42px;
  }
}

@media(max-width:420px){
  .main-logo{width:120px}
  .academy-name{font-size:16px}
  .timer-box{font-size:24px}
  .panel span{font-size:14px}
  .btn{font-size:15px}
  .letter{font-size:37px}
}

/* ==========================================================
   Academy Stable Glass v2.3
   - ألوان الشعار فقط
   - بدون وردي
   - لون الخلية بعد الاختيار = نفس اللون المختار
   - لا يوجد color-mix ولا مزج يغير اللون
   ========================================================== */

:root{
  --bg1:#FCFBF8;
  --bg2:#F7F6F2;
  --text:#1f2937;
  --cell:#ffffff;
  --cellText:#111827;

  --teamLR:#4F7DC7;
  --teamTB:#8BCB2F;
  --teamLRGlow:rgba(79,125,199,.38);
  --teamTBGlow:rgba(139,203,47,.38);

  --gold:#D4A326;
  --goldSoft:#F6C744;
}

body.light{
  --bg1:#FCFBF8;
  --bg2:#F7F6F2;
  --text:#1f2937;
  --cell:#ffffff;
  --cellText:#111827;
}

body{
  position:relative;
  overflow-x:hidden;
  color:#1f2937;
  background:
    radial-gradient(circle at 50% 12%, rgba(139,203,47,.075), transparent 23%),
    radial-gradient(circle at 12% 38%, rgba(79,125,199,.045), transparent 29%),
    radial-gradient(circle at 88% 42%, rgba(247,148,29,.045), transparent 30%),
    linear-gradient(180deg,#FCFBF8 0%,#F7F6F2 48%,#F1EFE8 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(15,23,42,.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.014) 1px, transparent 1px);
  background-size:58px 58px;
  opacity:.25;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(circle at center, transparent 0 58%, rgba(120,90,28,.075) 100%);
}

.page{
  position:relative;
  z-index:1;
}

.main-logo{
  width:220px;
  margin:0 auto 4px;
  filter:
    drop-shadow(0 12px 18px rgba(15,23,42,.10))
    drop-shadow(0 0 28px rgba(139,203,47,.12));
}

.developer-credit{
  position:fixed;
  right:18px;
  bottom:13px;
  z-index:999;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:11px;
  font-weight:500;
  letter-spacing:-.01em;
  color:rgba(29,37,50,.38);
  pointer-events:none;
  user-select:none;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}

.panel,
.match-score,
.score-pill,
.round-pill,
.start-row{
  color:#1f2937;
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    0 16px 34px rgba(15,23,42,.072),
    inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(16px) saturate(1.18);
  -webkit-backdrop-filter:blur(16px) saturate(1.18);
}

.modal{
  background:rgba(247,246,242,.66);
  backdrop-filter:blur(14px) saturate(1.10);
  -webkit-backdrop-filter:blur(14px) saturate(1.10);
}

.modal-box{
  color:#1f2937;
  background:
    radial-gradient(circle at 50% 0%,rgba(246,199,68,.13),transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.60));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:
    0 28px 74px rgba(15,23,42,.14),
    inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(18px) saturate(1.16);
  -webkit-backdrop-filter:blur(18px) saturate(1.16);
}

input,select{
  color:#1f2937;
  background:rgba(255,255,255,.64);
  border:1px solid rgba(15,23,42,.10);
}

select option{
  color:#111827;
}

.btn{
  color:#1f2937;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.62));
  border:1px solid rgba(15,23,42,.10);
  box-shadow:0 10px 22px rgba(15,23,42,.065), inset 0 1px 0 rgba(255,255,255,.95);

<body>

<div class="page">

<div class="toolbar">

<script>
const colors = [
  {name:"أخضر الأكاديمية", value:"#8BCB2F"},
  {name:"أزرق الأكاديمية", value:"#4F7DC7"},
  {name:"برتقالي الأكاديمية", value:"#F7941D"},
  {name:"أصفر الأكاديمية", value:"#F6C744"},
  {name:"بني الأكاديمية", value:"#8B4A22"},
  {name:"بنفسجي الشعار", value:"#5B4BB2"}
];

let selectedTBColor = "#8BCB2F";
let selectedLRColor = "#4F7DC7";

const lettersPool = [
  "أ","ب","ت","ث","ج",
  "ح","خ","د","ذ","ر",
  "ز","س","ش","ص","ض",
  "ط","ظ","ع","غ","ف",
  "ق","ك","ل","م","ن"
];

const rows = 5;
const cols = 5;

const R = 60;
const W = Math.sqrt(3) * R;
const H = 2 * R;
const xStep = W;
const yStep = H * 0.75;
const startX = 140;
const startY = 85;

const svg = document.getElementById("svgBoard");
const cellMap = new Map();
let activeCell = null;

let gameOver = false;
let gameStarted = false;
let timerInterval = null;
let remainingSeconds = 30;
let resetArmed = false;
let totalRounds = 1;
let targetWins = 1;
let currentRound = 1;
let tbRoundWins = 0;
let lrRoundWins = 0;
let matchOver = false;

setupDropdowns();
renderPalettes();
createBoard();
updateTimerDisplay();
applyTeamColors();
updateMatchScore();

document.getElementById("teamTBName").addEventListener("input", updateMatchScore);
document.getElementById("teamLRName").addEventListener("input", updateMatchScore);

function setupDropdowns(){
  const m = document.getElementById("minutes");
  const s = document.getElementById("seconds");

  for(let i=0;i<=10;i++){
    m.innerHTML += `<option value="${i}">${i}</option>`;
  }

  for(let i=0;i<60;i+=5){
    s.innerHTML += `<option value="${i}">${i}</option>`;
  }

  m.value = 0;
  s.value = 30;
}

function renderPalettes(){
  const tb = document.getElementById("paletteTB");
  const lr = document.getElementById("paletteLR");

  tb.innerHTML = "";
  lr.innerHTML = "";

  colors.forEach(color => {
    const btnTB = document.createElement("button");
    btnTB.className = "color-choice";
    btnTB.style.background = color.value;
    btnTB.title = color.name;

    if(color.value === selectedTBColor) btnTB.classList.add("active");
    if(color.value === selectedLRColor) btnTB.classList.add("disabled");

    btnTB.onclick = () => {
      selectedTBColor = color.value;
      renderPalettes();
      applyTeamColors();
    };

    tb.appendChild(btnTB);

    const btnLR = document.createElement("button");
    btnLR.className = "color-choice";
    btnLR.style.background = color.value;
    btnLR.title = color.name;

    if(color.value === selectedLRColor) btnLR.classList.add("active");
    if(color.value === selectedTBColor) btnLR.classList.add("disabled");

    btnLR.onclick = () => {
      selectedLRColor = color.value;
      renderPalettes();
      applyTeamColors();
    };

    lr.appendChild(btnLR);
  });
}

function hexToRgba(hex, alpha){
  const clean = hex.replace("#","");
  const bigint = parseInt(clean,16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyTeamColors(){
  document.documentElement.style.setProperty("--teamTB", selectedTBColor);
  document.documentElement.style.setProperty("--teamLR", selectedLRColor);
  document.documentElement.style.setProperty("--teamTBGlow", hexToRgba(selectedTBColor,.38));
  document.documentElement.style.setProperty("--teamLRGlow", hexToRgba(selectedLRColor,.38));
}

function updateMatchScore(){
  const tb = document.getElementById("teamTBName")?.value || "فوق/تحت";
  const lr = document.getElementById("teamLRName")?.value || "يمين/يسار";

  document.getElementById("tbScorePill").innerHTML = `${tb} <span class="num" id="tbWins">${tbRoundWins}</span>`;
  document.getElementById("lrScorePill").innerHTML = `${lr} <span class="num" id="lrWins">${lrRoundWins}</span>`;
  document.getElementById("roundInfo").textContent = totalRounds === 1 ? "جولة واحدة" : `جولة ${currentRound} من ${totalRounds}`;
}

function startGame(){
  applyTeamColors();

  totalRounds = Number(document.querySelector('input[name="matchMode"]:checked').value);
  targetWins = Math.floor(totalRounds / 2) + 1;
  currentRound = 1;
  tbRoundWins = 0;
  lrRoundWins = 0;
  matchOver = false;
  updateMatchScore();

  document.getElementById("setupModal").classList.remove("show");

  const tb = document.getElementById("teamTBName").value || "الفريق الأخضر";
  const lr = document.getElementById("teamLRName").value || "الفريق الأزرق";

  document.getElementById("rulesText").innerHTML =
    `${tb}: من فوق لتحت<br>${lr}: من يمين ليسار<br><br>نظام المباراة: ${totalRounds === 1 ? "جولة واحدة" : totalRounds + " جولات"}<br>الفائز يحتاج ${targetWins} ${targetWins === 1 ? "فوز" : "انتصارات"}`;

  document.getElementById("rulesModal").classList.add("show");
}

function closeRules(){
  gameStarted = true;
  document.getElementById("rulesModal").classList.remove("show");
}

function shuffle(array){
  const copy = [...array];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function createBoard(){
  svg.innerHTML = `
    <defs>
      <linearGradient id="cellGlassStable" x1="14%" y1="0%" x2="86%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".96"/>
        <stop offset="45%" stop-color="#f7fbff" stop-opacity=".76"/>
        <stop offset="100%" stop-color="#eef3fb" stop-opacity=".94"/>
      </linearGradient>
      <radialGradient id="cellShineStable" cx="30%" cy="18%" r="72%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
        <stop offset="42%" stop-color="#ffffff" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
  `;
  cellMap.clear();

  const letters = shuffle(lettersPool);
  let index = 0;

  for(let row = 0; row < rows; row++){
    const offsetX = row % 2 === 0 ? W / 2 : 0;

    for(let col = 0; col < cols; col++){
      const cx = startX + offsetX + col * xStep;
      const cy = startY + row * yStep;
      const letter = letters[index++];

      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","cell");
      g.dataset.state = "0";
      g.dataset.row = row;
      g.dataset.col = col;
      g.dataset.key = `${row},${col}`;
      g.dataset.owner = "";

      const polygon = document.createElementNS("http://www.w3.org/2000/svg","polygon");
      polygon.setAttribute("points",getHexPoints(cx,cy,R));
      polygon.setAttribute("class","hex");

      const shine = document.createElementNS("http://www.w3.org/2000/svg","polygon");
      shine.setAttribute("points",getInnerHexPoints(cx,cy - 11,R * .55));
      shine.setAttribute("class","hex-shine");

      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x",cx);
      text.setAttribute("y",cy + 5);
      text.setAttribute("class","letter");
      text.textContent = letter;

      g.appendChild(polygon);
      g.appendChild(shine);
      g.appendChild(text);
      g.onclick = () => openQuestionModal(g);

      svg.appendChild(g);
      cellMap.set(`${row},${col}`,g);
    }
  }
}

function getHexPoints(cx,cy,r){
  const points = [];
  for(let i = 0; i < 6; i++){
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    points.push(`${x},${y}`);
  }
  return points.join(" ");
}

function getInnerHexPoints(cx,cy,r){
  const points = [];
  for(let i = 0; i < 6; i++){
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    points.push(`${x},${y}`);
  }
  return points.join(" ");
}

function openQuestionModal(cell){
  if(gameOver || !gameStarted) return;

  activeCell = cell;
  document.querySelectorAll(".cell").forEach(c => c.classList.remove("selected"));
  cell.classList.add("selected");

  const letterNode = cell.querySelector(".letter");
  const letter = letterNode ? letterNode.textContent : "؟";
  const tbName = document.getElementById("teamTBName").value || "فريق فوق / تحت";
  const lrName = document.getElementById("teamLRName").value || "فريق يمين / يسار";

  document.getElementById("questionLetter").textContent = letter;
  document.getElementById("answerTBBtn").textContent = tbName;
  document.getElementById("answerLRBtn").textContent = lrName;
  document.getElementById("questionModal").classList.add("show");
}

function closeQuestionModal(){
  document.getElementById("questionModal").classList.remove("show");

  if(activeCell){
    activeCell.classList.remove("selected");
  }

  activeCell = null;
}

function awardSelectedCell(team){
  if(!activeCell || gameOver) return;

  activeCell.classList.remove("selected","teamLR","teamTB","win");
  activeCell.classList.add(team);
  activeCell.dataset.owner = team;
  activeCell.dataset.state = team === "teamLR" ? "2" : "3";

  const awardedCell = activeCell;
  activeCell = null;
  document.getElementById("questionModal").classList.remove("show");

  checkWinner(team);
}

function checkWinner(team){
  const cells = [...document.querySelectorAll(".cell")];

  if(team === "teamLR"){
    const leftSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.col) === 0
    );

    const rightSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.col) === cols - 1
    );

    for(const start of leftSide){
      const path = findPath(start,rightSide,team);
      if(path){
        showWinner(document.getElementById("teamLRName").value, path, "teamLR");
        return true;
      }
    }
  }

  if(team === "teamTB"){
    const topSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.row) === 0
    );

    const bottomSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.row) === rows - 1
    );

    for(const start of topSide){
      const path = findPath(start,bottomSide,team);
      if(path){
        showWinner(document.getElementById("teamTBName").value, path, "teamTB");
        return true;
      }
    }
  }

  return false;
}

function findPath(start,targets,team){
  const visited = new Set();
  const parent = new Map();
  const stack = [start];

  while(stack.length){
    const current = stack.pop();

    if(visited.has(current.dataset.key)) continue;
    visited.add(current.dataset.key);

    if(targets.includes(current)){
      const path = [];
      let node = current;

      while(node){
        path.push(node);
        node = parent.get(node.dataset.key);
      }

      return path;
    }

    getNeighbors(current).forEach(neighbor => {
      if(neighbor.dataset.owner === team && !visited.has(neighbor.dataset.key)){
        parent.set(neighbor.dataset.key,current);
        stack.push(neighbor);
      }
    });
  }

  return null;
}

function getNeighbors(cell){
  const r = Number(cell.dataset.row);
  const c = Number(cell.dataset.col);
  const pushedRight = r % 2 === 0;

  let coords = [
    [r,c - 1],
    [r,c + 1]
  ];

  if(pushedRight){
    coords.push([r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]);
  }else{
    coords.push([r-1,c],[r-1,c-1],[r+1,c],[r+1,c-1]);
  }

  return coords
    .map(([row,col]) => cellMap.get(`${row},${col}`))
    .filter(Boolean);
}

function showWinner(teamName,path,teamKey){
  if(gameOver) return;

  gameOver = true;
  pauseTimer();

  path.forEach(cell => cell.classList.add("win"));

  if(teamKey === "teamTB") tbRoundWins++;
  if(teamKey === "teamLR") lrRoundWins++;

  const reachedTarget = teamKey === "teamTB" ? tbRoundWins >= targetWins : lrRoundWins >= targetWins;
  matchOver = reachedTarget || totalRounds === 1;

  updateMatchScore();

  if(matchOver){
    document.getElementById("winnerText").textContent = `فاز ${teamName} بالمباراة!`;
    document.getElementById("winnerSub").textContent = `النتيجة: ${tbRoundWins} - ${lrRoundWins}`;
    document.getElementById("nextRoundBtn").textContent = "مباراة جديدة";
  }else{
    document.getElementById("winnerText").textContent = `فاز ${teamName} بالجولة!`;
    document.getElementById("winnerSub").textContent = `النتيجة: ${tbRoundWins} - ${lrRoundWins}`;
    document.getElementById("nextRoundBtn").textContent = "الجولة التالية";
  }

  launchConfetti();
  launchFire();

  setTimeout(() => {
    document.getElementById("winnerModal").classList.add("show");
  },650);
}

function launchConfetti(){
  const palette = [selectedTBColor, selectedLRColor, "#D4AF37", "#FDE68A", "#FFFFFF"];

  for(let i = 0; i < 180; i++){
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = palette[Math.floor(Math.random() * palette.length)];
    piece.style.animationDelay = Math.random() * .7 + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 4200);
  }
}

function launchFire(){
  for(let i = 0; i < 46; i++){
    const flame = document.createElement("div");
    flame.className = "flame";
    flame.textContent = Math.random() > .35 ? "🔥" : "✨";
    flame.style.left = Math.random() * 100 + "vw";
    flame.style.animationDelay = Math.random() * .8 + "s";
    flame.style.fontSize = (24 + Math.random() * 30) + "px";
    document.body.appendChild(flame);
    setTimeout(() => flame.remove(), 3300);
  }
}

function newRoundFromWinner(){
  document.getElementById("winnerModal").classList.remove("show");

  if(matchOver){
    resetGame();
    return;
  }

  currentRound++;
  newBoard();
  updateMatchScore();
}

function newBoard(){
  pauseTimer();
  gameOver = false;
  gameStarted = true;
  resetArmed = false;
  document.getElementById("resetBtn").textContent = "إعادة اللعبة";
  document.getElementById("winnerModal").classList.remove("show");
  createBoard();
  updateMatchScore();
}

function startTimer(){
  pauseTimer();

  const min = Number(document.getElementById("minutes").value);
  const sec = Number(document.getElementById("seconds").value);

  remainingSeconds = min * 60 + sec;
  if(remainingSeconds <= 0) remainingSeconds = 30;

  updateTimerDisplay();

  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimerDisplay();

    if(remainingSeconds <= 0){
      pauseTimer();
      alert("انتهى الوقت");
    }
  },1000);
}

function pauseTimer(){
  clearInterval(timerInterval);
}

function updateTimerDisplay(){
  const m = String(Math.floor(remainingSeconds / 60)).padStart(2,"0");
  const s = String(remainingSeconds % 60).padStart(2,"0");
  document.getElementById("timerDisplay").textContent = `${m}:${s}`;
}

function confirmReset(){
  const btn = document.getElementById("resetBtn");

  if(!resetArmed){
    resetArmed = true;
    btn.textContent = "اضغط مرة ثانية للتأكيد";

    setTimeout(() => {
      resetArmed = false;
      btn.textContent = "إعادة اللعبة";
    },2500);

    return;
  }

  resetGame();
}

function resetGame(){
  location.reload();
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

function togglePresentation(){
  document.body.classList.toggle("presentation");
}
</script>

</body>
</html>
